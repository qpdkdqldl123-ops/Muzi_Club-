<style>
/* 기억의 5초: 카카오톡 채팅방 느낌의 모바일 화면 */
:root {
  --yellow: #FEE500;
  --yellow-d: #E6CE00;
  --brown: #3C1E1E;
  --ink: #191919;
  --chat: #B9CEE0;
  --gray: #5B6B7B;
  --line: #E6E9EC;
  --soft: #F2F4F6;
  --blue: #2F5FB0;
  --red: #E5484D;
  --font: 'Noto Sans KR', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: #E9EDF1; }
body { font-family: var(--font); color: var(--ink); font-size: 15px; line-height: 1.4; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
[hidden] { display: none !important; }
svg { display: block; }

#app { position: fixed; inset: 0 0 auto 0; height: 100%; max-width: 440px; margin: 0 auto; background: #fff; overflow: hidden; box-shadow: 0 0 40px rgba(0, 0, 0, .12); }
.page { position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0; }

/* 공통 */
.avatar { display: inline-grid; place-items: center; background: #6E9BD6; border-radius: 34%; flex: none; }
.avatar svg { width: 62%; height: 62%; }
.cta { display: block; width: 100%; height: 54px; border-radius: 14px; background: var(--yellow); color: var(--brown); font-size: 18px; font-weight: 800; letter-spacing: .02em; transition: transform .08s, background .15s; }
.cta:active { transform: scale(.98); background: var(--yellow-d); }
.cta:disabled { background: #ECEEF0; color: #A4ABB2; transform: none; cursor: default; }
.toast { position: absolute; left: 50%; top: 64px; transform: translate(-50%, -8px); max-width: 86%; padding: 9px 15px; border-radius: 20px; background: rgba(25, 25, 25, .82); color: #fff; font-size: 13px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
:focus-visible { outline: 3px solid #2F6BFF; outline-offset: 2px; }

/* ---------------- 첫 화면: 번호 고르기 ---------------- */
#intro { background: #fff; }
.ibar { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 16px; flex: none; }
.brand { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 800; color: var(--brown); }
.brand .avatar { width: 30px; height: 30px; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--soft); font-size: 12.5px; font-weight: 700; color: #4A5560; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: #B7BEC6; }
.pill.ok i { background: #22B573; }
.pill.wait i { background: #F5A524; }
.pill.bad i { background: var(--red); }
.pill.busy i { animation: blink .7s infinite alternate; background: #F5A524; }
@keyframes blink { to { opacity: .25; } }

.ibody { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 16px 14px; -webkit-overflow-scrolling: touch; }
.sech { margin: 6px 2px 10px; font-size: 15px; font-weight: 800; color: var(--brown); display: flex; align-items: center; gap: 7px; }
.sech svg { width: 18px; height: 18px; }

.search { position: relative; margin: 0 0 10px; }
.search .si { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; margin-top: -9px; color: #8A949E; pointer-events: none; }
.search .si svg { width: 18px; height: 18px; }
.search input { width: 100%; height: 46px; border-radius: 14px; border: 2px solid transparent; background: var(--soft); padding: 0 44px 0 42px; font-size: 16px; font-weight: 500; -webkit-appearance: none; appearance: none; }
.search input::-webkit-search-cancel-button, .search input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
.search input::placeholder { color: #A2ABB4; }
.search input:focus { outline: 0; border-color: var(--yellow); background: #fff; }
.search .clr { position: absolute; right: 2px; top: 50%; width: 42px; height: 42px; margin-top: -21px; display: grid; place-items: center; color: #8A949E; }
.search .clr svg { width: 16px; height: 16px; }

.nlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.nitem { display: flex; align-items: stretch; background: var(--soft); border-radius: 16px; overflow: hidden; }
.npick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 9px 4px 9px 12px; text-align: left; transition: background .12s; }
.npick:active { background: #E6E9EC; }
.nbadge { width: 40px; height: 40px; border-radius: 14px; background: var(--yellow); color: var(--brown); display: grid; place-items: center; font-size: 17px; font-weight: 800; flex: none; }
.nbadge.ico svg { width: 20px; height: 20px; }
.ntxt { min-width: 0; display: grid; gap: 1px; flex: 1; }
.nname { font-size: 16.5px; font-weight: 800; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nname.none { color: #8A949E; font-weight: 600; }
.nnum { font-size: 13.5px; color: var(--gray); font-variant-numeric: tabular-nums; letter-spacing: .02em; white-space: nowrap; }
.ngo { flex: none; width: 20px; height: 20px; color: #A4ADB6; }
.ngo svg { width: 20px; height: 20px; }
.nbtn { flex: none; width: 42px; display: grid; place-items: center; color: #7C8792; }
.nbtn svg { width: 17px; height: 17px; }
.nbtn:active { background: #E6E9EC; }
.nbtn.armed { width: 54px; background: var(--red); color: #fff; font-size: 13px; font-weight: 800; }
.nedit { flex: 1; display: flex; gap: 6px; align-items: center; padding: 9px 9px 9px 12px; min-height: 62px; }
.nedit input { flex: 1; min-width: 0; height: 44px; border-radius: 12px; border: 2px solid transparent; background: #fff; padding: 0 12px; font-size: 16px; font-weight: 700; }
.nedit input:focus { outline: 0; border-color: var(--yellow); }
.nedit .ok, .nedit .no { flex: none; height: 44px; padding: 0 13px; border-radius: 12px; font-size: 14px; font-weight: 800; }
.nedit .ok { background: var(--brown); color: var(--yellow); }
.nedit .no { background: #fff; color: #5B6B7B; }
.empty { margin: 18px 6px 6px; text-align: center; color: #7C8792; font-size: 14px; line-height: 1.5; }

.setrow { width: 100%; display: flex; align-items: center; gap: 11px; margin: 14px 0 0; padding: 8px 10px 8px 8px; border-radius: 14px; border: 1.5px dashed #CBD2D9; color: #4A5560; font-size: 14px; font-weight: 700; text-align: left; }
.setrow .th { width: 46px; height: 34px; border-radius: 8px; background: #E3E8ED center / cover no-repeat; flex: none; }
.setrow .chev { margin-left: auto; width: 18px; height: 18px; color: #8A949E; transition: transform .2s; }
.setrow .chev svg { width: 18px; height: 18px; }
.setrow[aria-expanded="true"] .chev { transform: rotate(90deg); }
.setpanel { margin: 8px 0 0; padding: 12px; border-radius: 14px; background: var(--soft); display: grid; gap: 9px; }
.setpanel .pv { aspect-ratio: 4 / 3; max-height: 170px; width: 100%; border-radius: 10px; background: #DDE3E8 center / cover no-repeat; }
.setpanel .row2 { display: flex; gap: 8px; }
.setpanel .mini2 { flex: 1; height: 42px; border-radius: 12px; background: #fff; border: 1.5px solid #D6DBE0; font-size: 14px; font-weight: 700; color: #3A4650; }
.setpanel .plabel { font-size: 12.5px; font-weight: 800; color: #4A5560; margin-top: 2px; }
.setpanel input[type="text"] { height: 44px; border-radius: 12px; border: 2px solid transparent; background: #fff; padding: 0 12px; font-size: 15px; }
.setpanel input[type="text"]:focus { outline: 0; border-color: var(--yellow); }
.setpanel .hint { margin: 0; font-size: 11px; line-height: 1.5; color: #7C8792; }
.setpanel .hint a { color: inherit; }
.setpanel .hint:empty { display: none; }
.setpanel .gth { display: flex; flex-wrap: wrap; gap: 6px; }
.setpanel .gt { position: relative; width: 74px; height: 56px; border-radius: 9px; overflow: hidden; background: #DDE3E8; }
.setpanel .gt img { width: 100%; height: 100%; object-fit: cover; display: block; }
.setpanel .gx { position: absolute; right: 0; top: 0; width: 32px; height: 32px; display: grid; place-items: center; color: #fff; }
.setpanel .gx::before { content: ''; position: absolute; right: 4px; top: 4px; width: 20px; height: 20px; border-radius: 50%; background: rgba(25, 25, 25, .62); }
.setpanel .gx svg { position: relative; width: 12px; height: 12px; margin: -6px -6px 0 0; }
.setpanel .cloud { display: grid; gap: 9px; padding-bottom: 10px; border-bottom: 1px dashed #D6DBE0; }
.setpanel .cloud[hidden], .setpanel .clogin[hidden], .setpanel .row2[hidden], .setpanel .mini2[hidden] { display: none; }
.setpanel .clogin { display: grid; gap: 7px; }
.setpanel .clogin input { height: 44px; border-radius: 12px; border: 2px solid transparent; background: #fff; padding: 0 12px; font-size: 16px; min-width: 0; }
.setpanel .clogin input:focus { outline: 0; border-color: var(--yellow); }
.setpanel .clogin .mini2 { flex: none; }
.setpanel .mini2:disabled { color: #A4ABB2; background: #EEF0F2; border-color: #E3E6E9; cursor: default; }

.addbar { flex: none; display: grid; gap: 8px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #fff; }
.addbar .f2 { display: grid; grid-template-columns: .86fr 1.3fr; gap: 8px; }
.addbar input { min-width: 0; height: 46px; border-radius: 14px; border: 2px solid transparent; background: var(--soft); padding: 0 14px; font-size: 16px; font-weight: 700; letter-spacing: .02em; }
.addbar input::placeholder { color: #A2ABB4; font-weight: 500; }
.addbar input:focus { outline: 0; border-color: var(--yellow); background: #fff; }
.addbar input.bad { border-color: var(--red); }
.addbar .cta { height: 50px; font-size: 17px; }
.err { margin: 0 2px; color: var(--red); font-size: 12.5px; font-weight: 700; }

/* ---------------- 채팅방 ---------------- */
#chat { background: var(--chat); }
.cbar { flex: none; height: 52px; display: flex; align-items: center; padding: 0 6px; background: var(--chat); }
.cbar button { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ink); }
.cbar button svg { width: 24px; height: 24px; }
.cbar .ttl { font-size: 17px; font-weight: 800; margin-left: 2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cbar .ttl small { margin-left: 8px; font-size: 13px; font-weight: 500; color: var(--gray); }
.cbar .ttl small:empty { display: none; }

.feed { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px 12px 18px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
.date { width: max-content; margin: 8px auto 14px; padding: 5px 14px; border-radius: 14px; background: rgba(80, 100, 120, .32); color: #fff; font-size: 12px; font-weight: 500; }
.row { display: flex; align-items: flex-start; gap: 8px; margin-top: 4px; animation: pop .22s ease-out both; }
.row.gap { margin-top: 12px; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.row .avatar { width: 40px; height: 40px; border-radius: 16px; }
.row .avatar.ghost { visibility: hidden; }
.row .col { display: flex; flex-direction: column; min-width: 0; max-width: calc(100% - 52px); }
.row.wide .col { flex: 1 1 auto; }
.row.wide .line { width: 100%; }
.row .name { margin: 0 0 4px 2px; font-size: 12.5px; color: #34424F; }
.line { display: flex; align-items: flex-end; gap: 6px; }
.t { flex: none; font-size: 10.5px; color: #55687A; padding-bottom: 1px; white-space: nowrap; }
.row.me { justify-content: flex-end; }
.row.me .line { flex-direction: row-reverse; }
.row.me .col { align-items: flex-end; }
.row.me { cursor: pointer; }
.bub { position: relative; padding: 8px 11px; border-radius: 13px; background: #fff; font-size: 14.5px; line-height: 1.42; word-break: keep-all; overflow-wrap: anywhere; box-shadow: 0 1px 0 rgba(0, 0, 0, .04); }
.row.me .bub { background: var(--yellow); display: flex; align-items: center; gap: 7px; }
.row.me .bub .face { width: 22px; height: 22px; flex: none; margin: -2px 0; }
.row.me .bub .ic { width: 17px; height: 17px; flex: none; color: var(--brown); }
/* 소항목 4개의 답을 한 말풍선에: 왼쪽 소항목(작게) · 오른쪽 내 답 */
.row.me .bub.recap { display: grid; grid-template-columns: auto 1fr; gap: 3px 9px; align-items: baseline; text-align: left; padding: 8px 12px; font-size: 13.5px; }
.recap .rl { font-size: 11.5px; line-height: 1.35; color: rgba(60, 30, 30, .62); white-space: nowrap; }
.recap .ra { font-weight: 800; line-height: 1.35; color: var(--brown); }
.bub.first::before { content: ''; position: absolute; top: 0; width: 0; height: 0; border-style: solid; }
.row.bot .bub.first::before { left: -7px; border-width: 0 8px 9px 0; border-color: transparent #fff transparent transparent; }
.row.me .bub.first::before { right: -7px; border-width: 0 0 9px 8px; border-color: transparent transparent transparent var(--yellow); }
.row.bot .bub.first { border-top-left-radius: 4px; }
.row.me .bub.first { border-top-right-radius: 4px; }

.typing { display: flex; gap: 5px; padding: 8px 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9AA6B2; animation: bounce 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

/* 퀴즈 말풍선 */
.quizq { display: block; }
.quizq .tagq { display: inline-block; margin-right: 6px; padding: 0 7px; border-radius: 9px; background: var(--brown); color: var(--yellow); font-size: 11.5px; font-weight: 800; line-height: 19px; vertical-align: 1px; }
.quizq .q { font-weight: 800; }
.quizq .hint { display: block; margin-top: 2px; font-size: 12px; color: var(--gray); }
.qopts .choice { padding: 5px 3px; min-height: 52px; font-size: 14px; white-space: nowrap; font-weight: 800; }

/* 소개 카톡 1: 센터 사진·이름·위치 (왼쪽) + 인스타그램 사진 (오른쪽) */
.bub.aff { flex: 1 1 auto; min-width: 0; padding: 8px; display: grid; grid-template-columns: .88fr 1.32fr; gap: 8px; align-items: center; }
.aff .l { display: grid; gap: 5px; min-width: 0; align-content: start; }
.aff .ph { position: relative; aspect-ratio: 4 / 3; border-radius: 9px; overflow: hidden; background: #E3E8ED; }
.aff .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.aff .tag { position: absolute; left: 4px; top: 4px; padding: 0 6px; border-radius: 8px; background: rgba(25, 25, 25, .62); color: #fff; font-size: 9.5px; font-weight: 700; line-height: 16px; }
.aff .nm { font-size: 13.5px; line-height: 1.25; font-weight: 800; color: var(--brown); }
.aff .loc { display: flex; align-items: flex-start; gap: 3px; font-size: 11.5px; line-height: 1.35; color: var(--gray); text-decoration: none; word-break: keep-all; }
.aff .loc svg { width: 13px; height: 13px; flex: none; margin-top: 1px; color: var(--red); }
.aff .r { min-width: 0; }
.aff .ig { display: block; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
.aff .ig img { display: block; width: 100%; height: auto; }
.aff .ig.txt { padding: 18px 8px; text-align: center; font-weight: 800; font-size: 13px; color: var(--ink); text-decoration: none; }
.aff .cr { grid-column: 1 / -1; margin: 0; padding-top: 6px; border-top: 1px solid var(--line); font-size: 9.5px; line-height: 1.45; color: #6A7886; }
.aff .cr a { color: inherit; }

/* 소개 카톡 2: 풀이 + 우리가 하는 일 + 협회 번호 + 멜로디 만들기 */
.bub.about { flex: 1 1 auto; min-width: 0; max-width: 316px; }
.about p { margin: 0 0 8px; }
.about p:last-of-type { margin-bottom: 8px; }
.about b { font-weight: 800; }
.about .p1 b { color: var(--brown); }
.about .tel { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; padding: 8px 11px; border-radius: 12px; background: var(--soft); color: var(--ink); text-decoration: none; font-size: 13.5px; }
.about .tel svg { width: 17px; height: 17px; flex: none; color: var(--brown); }
.about .tel .org { color: var(--gray); font-weight: 500; }
.about .tel .num { margin-left: auto; font-weight: 800; font-size: 15px; letter-spacing: .01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mbtn { display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%; height: 44px; margin-top: 8px; border-radius: 12px; background: var(--yellow); color: var(--brown); font-size: 15.5px; font-weight: 800; transition: transform .08s, background .15s; }
.mbtn svg { width: 18px; height: 18px; }
.mbtn:active { transform: scale(.98); background: var(--yellow-d); }
.mbtn:disabled { background: #EEF0F2; color: #98A1AA; transform: none; cursor: default; }

/* 분석 말풍선 */
.bub.ana { flex: none; width: 236px; }
.ana-top { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15px; }
.ana-top em { margin-left: auto; font-style: normal; font-variant-numeric: tabular-nums; color: #2F5FB0; }
.eq { display: inline-flex; align-items: flex-end; gap: 2.5px; height: 18px; }
.eq i { width: 3.5px; border-radius: 2px; background: var(--brown); animation: eq .8s ease-in-out infinite alternate; }
.eq i:nth-child(1) { height: 7px; } .eq i:nth-child(2) { height: 16px; animation-delay: .12s; } .eq i:nth-child(3) { height: 11px; animation-delay: .24s; } .eq i:nth-child(4) { height: 17px; animation-delay: .06s; } .eq i:nth-child(5) { height: 9px; animation-delay: .3s; }
@keyframes eq { to { transform: scaleY(.35); } }
.meter { height: 6px; margin: 10px 0 9px; border-radius: 3px; background: #E8EBEE; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--yellow); border-radius: 3px; }
.ana ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font-size: 13.5px; color: #8A949E; }
.ana li { display: flex; align-items: center; gap: 8px; transition: color .2s; }
.ana li .st { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #D5DADF; flex: none; }
.ana li.run { color: var(--ink); font-weight: 700; }
.ana li.run .st { border-color: var(--yellow-d); border-top-color: transparent; animation: spin .7s linear infinite; }
.ana li.done { color: var(--ink); }
.ana li.done .st { border: 0; background: var(--yellow); display: grid; place-items: center; }
.ana li.done .st::after { content: ''; width: 7px; height: 4px; border-left: 2px solid var(--brown); border-bottom: 2px solid var(--brown); transform: translateY(-1px) rotate(-45deg); }
@keyframes spin { to { transform: rotate(360deg); } }

/* 악보 말풍선 */
.bub.sheet { flex: 1 1 auto; min-width: 0; padding: 10px 8px 8px; }
.sheet .top { display: flex; align-items: center; gap: 10px; padding: 0 2px; }
.mplay { width: 36px; height: 36px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; flex: none; color: var(--brown); transition: transform .08s; }
.mplay:active { transform: scale(.93); }
.mplay svg { width: 18px; height: 18px; }
.mplay .i-stop { display: none; }
.mplay.on .i-play { display: none; }
.mplay.on .i-stop { display: block; }
.sheet .tt { flex: 1; min-width: 0; }
.sheet .tt b { display: block; font-size: 14px; line-height: 1.3; font-weight: 800; color: var(--brown); }
.sheet .tt span { display: block; font-size: 11.5px; line-height: 1.35; color: var(--gray); }
.mtime { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--gray); flex: none; }
.sheet .paper { margin-top: 8px; padding: 6px 2px 4px; border-radius: 10px; background: #FFFEF9; border: 1px solid #EFE9D2; overflow: hidden; }
.score { color: #191919; display: block; max-width: 100%; height: auto; margin: 0 auto; }
.score .hl { fill: var(--yellow); opacity: 0; }
.score .n.on .hl { opacity: 1; }
.score .n.on .head { fill: #E59A00; }
.score .lab { fill: #4A5560; font-family: var(--font); }
.score .lyr { fill: #26303A; font-family: var(--font); font-weight: 500; }
.score .n.on .lyr { font-weight: 800; fill: #3C1E1E; }
.score .ext { color: #4A5560; }
.score .n.on .lab { font-weight: 700; fill: #3C1E1E; }

/* 봉사 활동 사진 말풍선 (QR 바로 위) */
.bub.gal { flex: 1 1 auto; min-width: 0; max-width: 340px; padding: 10px 0 10px 10px; }
.gal .gh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 12px 7px 2px; }
.gal .gh b { font-size: 14px; font-weight: 800; color: var(--brown); }
.gal .gh span { font-size: 11.5px; color: var(--gray); }
.gal .strip { gap: 6px; padding: 0 10px 0 0; scroll-snap-type: x mandatory; }
.gal figure { flex: 0 0 76%; margin: 0; scroll-snap-align: start; }
.gal.one figure { flex-basis: 100%; }
.gal img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px; background: #E3E8ED; }
.gal .gcr { margin: 7px 12px 0 2px; font-size: 10px; line-height: 1.5; color: #6A7886; }
.gal .gcr a { color: inherit; }

/* QR 말풍선 */
.bub.qrb { flex: 1 1 auto; min-width: 0; max-width: 340px; padding: 12px; }
.qrb .qr { display: block; width: min(100%, 248px); margin: 0 auto; aspect-ratio: 1; border-radius: 8px; background: #fff; }
.song { margin: 0 0 12px; padding: 0 0 12px; border-bottom: 1px dashed #D8DEE4; }
.song .stt b { display: block; font-size: 15px; line-height: 1.3; font-weight: 800; color: var(--brown); }
.song .stt span { display: block; margin-top: 1px; font-size: 12px; line-height: 1.35; color: var(--gray); }
.song .paper { margin-top: 8px; padding: 6px 2px 4px; border-radius: 10px; background: #FFFEF9; border: 1px solid #EFE9D2; overflow: hidden; }
.song .lyl { margin: 10px 0 0; text-align: center; }
.song .lyl p { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 700; color: #2A2A2A; }
.song .credit { margin: 8px 0 0; text-align: center; font-size: 11px; line-height: 1.4; color: #6A7886; }
.qrb .cap { margin: 10px 0 0; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 14.5px; font-weight: 800; color: var(--brown); }
.qrb .cap svg { width: 18px; height: 18px; }
.qrb .sub { margin: 6px 0 0; text-align: center; font-size: 12px; color: var(--gray); word-break: break-all; }
.qrb .open { display: block; margin: 8px auto 0; font-size: 12.5px; color: var(--blue); font-weight: 700; text-align: center; text-decoration: none; padding: 4px; }

/* 아래 칸 (고르기·악보 만지기·입력): 작고 촘촘하게 */
.dock { flex: none; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -3px 14px rgba(40, 60, 90, .1); padding-bottom: env(safe-area-inset-bottom); max-height: 62%; overflow-y: auto; animation: rise .22s ease-out both; }
.dock:empty { display: none; }
.dock.lock { pointer-events: none; opacity: .6; transition: opacity .15s; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.emos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px 2px; padding: 8px 8px 6px; }
.emo { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 0 3px; border-radius: 12px; border: 2px solid transparent; font-size: 12px; font-weight: 700; color: #2A2A2A; transition: transform .08s, background .15s; }
.emo .face { width: 34px; height: 34px; }
.emo:active { transform: scale(.94); background: var(--soft); }
.emo[aria-pressed="true"] { border-color: var(--yellow); background: #FFF9C7; }
.choices { display: grid; gap: 6px; padding: 10px 12px 12px; }
.choices.c3 { grid-template-columns: repeat(3, 1fr); }
.choice { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 8px; border-radius: 12px; background: var(--soft); border: 2px solid transparent; font-size: 13.5px; font-weight: 700; color: #2A2A2A; }
.choice .ic { width: 20px; height: 20px; flex: none; color: var(--brown); }
.choices.c3 .choice { flex-direction: column; gap: 3px; min-height: 54px; font-size: 12.5px; }
.choices.c3 .choice .ic { width: 22px; height: 22px; }
.choice:active { transform: scale(.97); background: #E9ECEF; }
.choice[aria-pressed="true"] { border-color: var(--yellow); background: #FFF9C7; }

/* 이야기 질문 하나 안의 소항목 4개 */
.srows { display: grid; gap: 7px; }
.srow { display: grid; gap: 3px; }
.slab { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; color: #4A5560; }
.slab i { width: 15px; height: 15px; border-radius: 50%; background: var(--brown); color: var(--yellow); font-style: normal; font-size: 10px; font-weight: 800; line-height: 15px; text-align: center; flex: none; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.sc { min-height: 36px; padding: 4px 3px; border-radius: 10px; background: var(--soft); border: 1.5px solid transparent; font-size: 12.5px; line-height: 1.25; font-weight: 700; color: #2A2A2A; text-align: center; word-break: keep-all; transition: transform .08s, background .12s; }
.sc[aria-pressed="true"] { background: #FFF9C7; border-color: var(--yellow); font-weight: 800; }
.sc:active { transform: scale(.97); }

/* 악보 아래 조절 칸 */
.vary { padding: 8px 10px 0; display: grid; gap: 6px; }
.vgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.vt { height: 31px; padding: 0 8px; border-radius: 10px; background: var(--soft); border: 2px solid transparent; font-size: 13px; font-weight: 700; color: #2A2A2A; white-space: nowrap; transition: transform .08s, background .12s; }
.vt[aria-pressed="true"] { background: #FFF9C7; border-color: var(--yellow); font-weight: 800; }
.vt:active { transform: scale(.97); }
.hscroll { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.hscroll::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--soft); border: 2px solid transparent; font-size: 13px; font-weight: 700; color: #2A2A2A; white-space: nowrap; }
.chip[aria-pressed="true"] { background: #FFF9C7; border-color: var(--yellow); }
.chip:active { transform: scale(.96); }
.steps { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.step { display: flex; align-items: center; justify-content: space-between; gap: 2px; height: 40px; padding: 0 3px; border-radius: 12px; background: var(--soft); }
.sbtn { width: 34px; height: 34px; border-radius: 10px; background: #fff; display: grid; place-items: center; color: var(--brown); box-shadow: 0 1px 0 rgba(0, 0, 0, .07); touch-action: manipulation; transition: transform .08s, background .12s; }
.sbtn svg { width: 17px; height: 17px; }
.sbtn:active { transform: scale(.9); background: var(--yellow); }
.sbtn:disabled { opacity: .35; transform: none; background: #fff; }
.sl2 { flex: 1; min-width: 0; display: grid; justify-items: center; line-height: 1.1; text-align: center; }
.sl2 small { font-size: 10px; font-weight: 700; color: var(--gray); }
.sl2 b { font-size: 14.5px; font-weight: 800; color: #2A2A2A; font-variant-numeric: tabular-nums; }
.more { display: grid; gap: 6px; padding: 2px 0 0; }
.sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.sl label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #4A5560; }
.sl output { font-weight: 500; color: var(--gray); font-variant-numeric: tabular-nums; }
.sl input { width: 100%; margin: 3px 0 0; accent-color: #E6B800; height: 24px; }
.vfoot { display: flex; gap: 6px; position: sticky; bottom: 0; z-index: 2; margin: 0 -10px; padding: 6px 10px 8px; background: #fff; box-shadow: 0 -6px 8px -6px rgba(40, 60, 90, .12); }
.vfoot .mini { flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--soft); color: #3A4650; display: grid; place-items: center; }
.vfoot .mini.on { background: #FFF9C7; }
.vfoot .mini svg { width: 18px; height: 18px; }
.vfoot .alt { flex: 1; height: 40px; border-radius: 12px; background: var(--brown); color: var(--yellow); font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; transition: transform .08s; }
.vfoot .alt:active { transform: scale(.97); }
.vfoot .alt svg { width: 17px; height: 17px; }
.vfoot .cta { flex: 1; height: 40px; border-radius: 12px; font-size: 15px; }

.quick { display: flex; gap: 6px; padding: 8px 10px 0; }
.quick .chip { height: 32px; background: #fff; border: 1.5px solid #D6DBE0; }
.inbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px 8px; }
.inbar input { flex: 1; min-width: 0; height: 38px; border-radius: 19px; border: 0; background: var(--soft); padding: 0 14px; font-size: 16px; }
.inbar input:focus { outline: 2px solid var(--yellow); background: #fff; }
.send { width: 38px; height: 38px; border-radius: 50%; background: #E3E6E9; display: grid; place-items: center; color: #fff; flex: none; transition: background .15s, transform .08s; }
.send svg { width: 18px; height: 18px; }
.send.on { background: var(--yellow); color: var(--brown); }
.send.on:active { transform: scale(.92); }
.endbar { display: flex; gap: 6px; padding: 8px 10px 10px; }
.endbar .cta { height: 42px; border-radius: 12px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.endbar .cta svg { width: 17px; height: 17px; }
.endbar .soft { flex: none; width: 112px; background: var(--soft); color: #3A4650; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; border-radius: 12px; height: 42px; }
.endbar .soft svg { width: 16px; height: 16px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
@media (max-height: 640px) {
  .emo .face { width: 30px; height: 30px; }
  .emo { padding: 3px 0 2px; font-size: 11.5px; }
  .emos { padding: 6px 8px 4px; }
  .dock { max-height: 70%; }
  .vary { padding-top: 6px; gap: 5px; }
  .vt { height: 30px; font-size: 12.5px; }
  .step { height: 38px; }
  .sbtn { width: 32px; height: 32px; }
  .srows { gap: 5px; }
  .sc { min-height: 34px; font-size: 12px; }
}
@media (max-width: 340px) {
  .qopts .choice { font-size: 13px; }
  .bub { font-size: 14px; }
  .sc { font-size: 12px; padding: 4px 2px; }
  .ngo { display: none; }
  .npick { padding-left: 10px; gap: 10px; }
  .nbtn { width: 38px; }
}

/* ---------- 시작 사진 보기 ---------- */
.shot { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; background: #111418; }
.shot[hidden] { display: none; }
.shotview { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; cursor: zoom-in; }
.shotview.z { cursor: grab; }
.shotview img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; will-change: transform; }
.shotbar { flex: none; display: grid; gap: 8px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); background: #fff; border-radius: 18px 18px 0 0; }
.shotbar .zoom { display: flex; align-items: center; justify-content: center; gap: 14px; }
.shotbar .zoom button { width: 44px; height: 36px; border-radius: 10px; background: var(--soft); font-size: 22px; font-weight: 700; color: #3A4650; line-height: 1; }
.shotbar .zoom button:disabled { color: #B9C0C6; }
.shotbar .zoom span { min-width: 54px; text-align: center; font-size: 14px; font-weight: 800; color: #4A5560; font-variant-numeric: tabular-nums; }
.shotbar .shint { margin: 0; text-align: center; font-size: 11.5px; color: #7C8792; }
.shotbar .cta { height: 50px; font-size: 17px; }
.setpanel .ibox { display: grid; gap: 9px; padding-top: 4px; }
.setpanel .ibox[hidden], .setpanel .ibox .mini2[hidden] { display: none; }

</style>
</head>
<body>
<div id="app">

  <!-- 첫 화면: 문자 받을 번호를 이름과 함께 저장하고, 찾아서 고르면 바로 채팅이 시작돼요 -->
  <section class="page" id="intro">
    <header class="ibar">
      <span class="brand"><span class="avatar" id="brandAv"></span>기억의 5초</span>
      <button type="button" class="pill" id="stat" hidden aria-live="polite"><i></i><span></span></button>
    </header>

    <div class="ibody" id="ibody">
      <h2 class="sech" id="numH"></h2>

      <div class="search" id="searchBox" hidden>
        <span class="si" id="searchIco" aria-hidden="true"></span>
        <input id="nq" type="search" inputmode="search" enterkeyhint="search" placeholder="이름·번호 검색" aria-label="이름이나 번호로 찾기" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="button" class="clr" id="nqx" aria-label="검색어 지우기" hidden></button>
      </div>

      <ul class="nlist" id="nlist" aria-label="저장한 번호"></ul>
      <p class="empty" id="nempty" role="status" hidden></p>

      <button type="button" class="setrow" id="setBtn" aria-expanded="false" aria-controls="setPanel">
        <span class="th" id="setTh"></span><span>센터 사진·위치</span><span class="chev" id="setChev"></span>
      </button>
      <div class="setpanel" id="setPanel" hidden>
        <div class="pv" id="pv" role="img" aria-label="센터 사진 미리보기"></div>
        <div class="row2">
          <button type="button" class="mini2" id="pchg">사진 바꾸기</button>
          <button type="button" class="mini2" id="pdef">예시 사진으로</button>
        </div>
        <label class="plabel" for="pplace">위치 (카톡 첫 말풍선에 나와요)</label>

const MelodyEngine = (() => {
  'use strict';

  /* ---------- 난수 ---------- */
  function hashStr(s) {
    let h = 2166136261 >>> 0;

      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;

    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);

    for (let i = 0; i + 1 < out.length; i++) {

    let best = -1, bestScore = -1e9;
    for (let i = 1; i < hum.length; i++) {

      const prev = hum[i - 1];
      const score = prev.dur + (hum[i].start - (prev.start + prev.dur)) * 2 - Math.abs(at - 0.5) * 3;

      const A = items.slice();
      for (const a of A) items.push({ start: a.start + half, dur: a.dur, rest: a.rest, tag: 'B', pair: a });
      if (2 * half < limit) items[items.length - 1].dur += limit - 2 * half;
    } else {
      fill(0, limit, 'M', 99);
    }
    items.push({ start: limit, dur: N - limit, rest: false, tag: 'end' });
    return items;
  }

  function velFor(emo, tend, t, strong, rng) {
    let v = 0.66 + (strong ? 0.14 : 0) + (rng() - 0.5) * 0.12;
    if (emo.dyn === 'swell') v *= 0.55 + 0.5 * t;
    else if (emo.dyn === 'fade') v *= 1 - 0.28 * t;
    return Math.max(0.22, Math.min(1, v * tend.velMul));
  }

  /* ---------- 기본 멜로디 만들기 ---------- */
  function build(sel) {
    const emoKey = EMOTIONS[sel.emotion] ? sel.emotion : 'calm';
    const reaKey = REASONS[sel.reason] ? sel.reason : 'self';
    const tenKey = TENDENCIES[sel.tendency] ? sel.tendency : 'balanced';
    const variant = sel.variant | 0;
    const emo = EMOTIONS[emoKey], rea = REASONS[reaKey], ten = TENDENCIES[tenKey];
    const styKey = STYLES[sel.style] ? sel.style : 'original';
    const sty = STYLES[styKey];
    const sc = SCALES[emo.scale];
    const root = emo.root;
    const L = sc.steps.length;
    const seed = hashStr(emoKey + '|' + reaKey + '|' + tenKey + '|' + variant);
    const rng = mulberry32(seed);

    // 스타일이 있으면 마음의 빠르기를 그 스타일의 범위 안으로 맞춰요
    let bpm = emo.bpm * ten.tempoMul;
    if (sty.bpm) bpm = Math.max(sty.bpm[0], Math.min(sty.bpm[1], bpm));
    const N = Math.max(8, Math.min(26, 2 * Math.round(bpm / 12)));
    const slotSec = 30 / bpm;
    const repeatMode = reaKey === 'relation' || reaKey === 'self';

    let items, sounding;
    for (let attempt = 0; attempt < 8; attempt++) {
      const weights = attempt === 0 ? emo.rhythm
        : emo.rhythm.map(p => [p[0], p[0] <= 2 ? p[1] * (1 + attempt) : p[1] / (1 + attempt)]);
      items = genRhythm(rng, N, Object.assign({}, emo, { rhythm: weights }), repeatMode);
      sounding = items.filter(i => !i.rest);
      if (sounding.length >= emo.minNotes) break;
    }
    const M = sounding.length;

    // 음높이 곡선 -> 음계 위의 계단 번호
    let raw = sounding.map((it, k) => emo.contour(M === 1 ? 1 : k / (M - 1)) + (rng() - 0.5) * emo.jitter);
    {
      const lo = Math.min.apply(null, raw), hi = Math.max.apply(null, raw);
      if (hi - lo < 7) {
        const mid = (hi + lo) / 2, f = 7 / Math.max(hi - lo, 0.5);
        raw = raw.map(h => mid + (h - mid) * f);
      }
    }
    let degs = raw.map(h => nearestDeg(root, sc, root + h));

    // 외로운: 한 번 크게 도약하는 자리를 정해 둔다
    let leapIdx = -1;
    if (emo.leap) {
      let best = -99;
      for (let k = 1; k < M; k++) { const df = degs[k] - degs[k - 1]; if (df > best) { best = df; leapIdx = k; } }
    }
    // 계단 폭 제한
    for (let k = 1; k < M; k++) {
      const df = degs[k] - degs[k - 1];
      if (Math.abs(df) > emo.maxStep && k !== leapIdx) degs[k] = degs[k - 1] + Math.sign(df) * emo.maxStep;
    }
    // 센박은 으뜸화음 음으로
    const snapProb = reaKey === 'family' ? 1 : 0.8;
    for (let k = 0; k < M; k++) {
      const it = sounding[k];
      const strong = it.start % 4 === 0;
      if ((strong || (reaKey === 'family' && it.dur >= 2)) && rng() < snapProb) degs[k] = snapChord(sc, degs[k]);
    }
    // 같은 음이 연달아 나오지 않게 (진로, 우울한은 일부러 허용)
    if (reaKey !== 'career' && !emo.allowRepeat) {
      for (let k = 1; k < M; k++) {
        if (degs[k] === degs[k - 1]) {
          const dir = raw[k] !== raw[k - 1] ? Math.sign(raw[k] - raw[k - 1]) : (rng() < 0.5 ? 1 : -1);
          degs[k] += dir || 1;
        }
      }
    }

    // 이유별 변형
    if (reaKey === 'relation' || reaKey === 'self') {
      const idxOf = new Map();
      sounding.forEach((it, k) => idxOf.set(it, k));
      const aIdx = [];
      sounding.forEach((it, k) => { if (it.tag === 'A') aIdx.push(k); });
      const pivot = aIdx.length ? aIdx.reduce((sum, k) => sum + degs[k], 0) / aIdx.length : degs[0];
      sounding.forEach((it, k) => {
        if (it.tag === 'B' && it.pair && idxOf.has(it.pair)) {
          const a = degs[idxOf.get(it.pair)];
          degs[k] = reaKey === 'relation' ? a + emo.answer : Math.round(2 * pivot - a);
        }
      });
    }
    if (reaKey === 'career') {
      const upto = Math.floor(M * 0.6);
      for (let k = 1; k <= upto; k += 2) degs[k] = degs[k - 1];
    }
    if (reaKey === 'memory' && M >= 6) {
      const motif = degs.slice(0, 3);
      const cand = [];
      for (let k = 0; k < M - 1; k++) if (sounding[k].start >= N * 0.56) cand.push(k);
      cand.slice(0, 3).forEach((k, j) => {
        const up = motif[j] + L;
        degs[k] = degToMidi(root, sc, up) <= 84 ? up : motif[j];
        sounding[k].echo = true;
      });
    }

    // 끝맺음
    const endSemi = emo.endSemi.length > 1 ? emo.endSemi[Math.floor(rng() * emo.endSemi.length)] : emo.endSemi[0];
    let endTarget = root + endSemi;
    if (M >= 2) endTarget += 12 * Math.round((degToMidi(root, sc, degs[M - 2]) - endTarget) / 12);
    degs[M - 1] = nearestDeg(root, sc, endTarget);
    if (emo.ending === 'sigh' && M >= 2) degs[M - 2] = degs[M - 1] + 1;

    // 너무 높거나 낮은 음은 옥타브를 옮겨서 음역 안으로 접는다
    const MIDI_LO = 43, MIDI_HI = 88;
    const fold = d => {
      while (degToMidi(root, sc, d) > MIDI_HI) d -= L;
      while (degToMidi(root, sc, d) < MIDI_LO) d += L;
      return d;
    };
    for (let k = 0; k < M; k++) degs[k] = fold(degs[k]);

    // 변형 뒤에 생긴 같은 음 반복을 다시 정리 (끝음은 그대로 두고 앞 음을 움직인다)
    if (reaKey !== 'career' && !emo.allowRepeat) {
      for (let pass = 0; pass < 6; pass++) {
        let changed = false;
        for (let k = 1; k < M; k++) {
          if (degs[k] !== degs[k - 1]) continue;
          const idx = k === M - 1 ? k - 1 : k;
          const prev = degs[idx - 1], next = degs[idx + 1];
          for (const off of [1, -1, 2, -2, 3, -3]) {
            const c = degs[idx] + off;
            const m = degToMidi(root, sc, c);
            if (c !== prev && c !== next && m >= MIDI_LO && m <= MIDI_HI) { degs[idx] = c; changed = true; break; }
          }
        }
        if (!changed) break;
      }
    }

    // 음 만들기
    let notes = sounding.map((it, k) => {
      const t = M === 1 ? 1 : k / (M - 1);
      let vel = velFor(emo, ten, t, it.start % 4 === 0, rng);
      if (it.echo) vel *= 0.7;
      if (it.tag === 'end') vel *= 0.92;
      return { deg: degs[k], midi: degToMidi(root, sc, degs[k]), start: it.start, dur: it.dur, vel, tag: it.tag };
    });

    // 연애(그리고 트로트): 꾸밈음
    if (reaKey === 'romance' || sty.ornament) {
      const out = [];
      let graces = 0;
      notes.forEach((n, i) => {
        if (n.dur >= 2 && n.tag !== 'end' && i > 0 && graces < 4 && rng() < (sty.ornament ? 0.6 : 0.45)) {
          out.push({ deg: n.deg + 1, midi: degToMidi(root, sc, n.deg + 1), start: n.start, dur: 0.5, vel: n.vel * 0.55, tag: 'grace', grace: true });
          out.push(Object.assign({}, n, { start: n.start + 0.5, dur: n.dur - 0.5 }));
          graces++;
        } else out.push(n);
      });
      notes = out;
    }

    // 인간관계: 대답하는 두 번째 목소리
    const voice2 = [];
    if (reaKey === 'relation') {
      notes.filter(n => n.tag === 'B' || n.tag === 'end').forEach(n => {
        const d = n.deg - 2;
        voice2.push({ deg: d, midi: degToMidi(root, sc, d), start: n.start, dur: n.dur, vel: n.vel * 0.55 });
      });
    }

    // 반주
    let accomp = [];
    const base = root - 12;
    const triad = sc.chord.map(i => degToMidi(root, sc, i) - 12);
    const padVel = { lonely: 0.5, blue: 0.62, lonesome: 0.7, tired: 0.6, lost: 0.6, anxious: 0.7, stuffy: 0.75 }[emoKey] || 0.85;
    // 으뜸화음을 이루는 음의 음이름(0~11). 마지막은 7음. 편곡한 반주는 이 음들로만 짜서 선율과 부딪히지 않아요.
    const chordPcs = sc.chord.map(i => (root + sc.steps[i % L]) % 12);
    chordPcs.push(L >= 7 ? (root + sc.steps[6]) % 12 : (root + 10) % 12);
    if (styKey !== 'original') {
      const hold = N >= 14 ? 4 : 3, k = 0.6 + 0.4 * padVel / 0.85;
      accomp = arrange(styKey, N, hold).map(a => Object.assign(a, { vel: Math.min(1, a.vel * k * (sty.mix || 1)) }));
    } else if (rea.bass === 'drone') {
      accomp.push({ midi: base, start: 0, dur: N, vel: 0.5 * padVel, kind: 'pad' });
      accomp.push({ midi: base + 7, start: 0, dur: N, vel: 0.36 * padVel, kind: 'pad' });
    } else if (rea.bass === 'chord') {
      triad.forEach((m, i) => accomp.push({ midi: m, start: 0, dur: N, vel: (i === 0 ? 0.5 : 0.36) * padVel, kind: 'pad' }));
    } else if (rea.bass === 'soft') {
      accomp.push({ midi: base, start: 0, dur: N, vel: 0.32 * padVel, kind: 'pad' });
    } else if (rea.bass === 'pulse') {
      for (let s = 0; s < N - 1; s += 2) accomp.push({ midi: s % 4 === 0 ? base : base + 7, start: s, dur: 1, vel: (s % 4 === 0 ? 0.55 : 0.4) * padVel, kind: 'pluck' });
    } else if (rea.bass === 'arp') {
      const order = [0, 1, 2, 1];
      for (let s = 0; s < N - 1; s++) accomp.push({ midi: triad[order[s % 4]] + 0, start: s, dur: 1, vel: 0.3 * padVel, kind: 'pluck' });
    }

    // 소개 문구
    const secs = N * slotSec;
    const text = {
      title: rea.phrase + ' ' + emo.label + ' 마음',
      emotionLine: emo.line,
      reasonLine: rea.line,
      specs: [sc.feel, 'BPM ' + Math.round(bpm), secs.toFixed(1) + '초'],
      lyric: lyricLines(emoKey, reaKey),
    };

    let voice = (emoKey === 'nostalgia' || reaKey === 'memory') ? 'musicbox' : ten.voice;
    const defaults = {
      tempo: 1, transpose: 0, voice,
      bright: ten.bright, reverb: emo.reverb,
      echo: reaKey === 'memory', harmony: false, reverse: false, swing: false, sparkle: false,
    };
    if (styKey !== 'original') {
      defaults.voice = sty.voice;
      defaults.bright = sty.bright; defaults.reverb = sty.reverb;
      defaults.echo = !!sty.echo; defaults.swing = !!sty.swing;
    }
    return {
      sel: { emotion: emoKey, reason: reaKey, tendency: tenKey, variant, style: styKey },
      seed, emo, rea, ten, style: styKey, scale: sc, scaleName: emo.scale, root, bpm, slots: N, slotSec, chordPcs,
      legato: emo.legato, notes, voice2, accomp, text, humVowel: HUM_VOWEL[emoKey], defaults,
    };
  }

  /* ---------- 폰 스피커에서 들리는 음역 ----------
     폰 스피커는 350Hz(F4) 아래를 거의 못 내요. 그래서 악기마다 선율 가운데 음의 최저선을 두고,
     모자라면 옥타브 단위로 통째로 올려요. 음 사이 간격은 그대로라 선율 모양은 변하지 않아요. */
  function regShift(base, voice) {
    const ms = base.notes.map(n => n.midi).sort((a, b) => a - b);
    if (!ms.length) return 0;
    const med = ms[ms.length >> 1], lo = ms[0], hi = ms[ms.length - 1];
    const floor = (VOICES[voice] || VOICES.piano).floor;
    let k = 0;
    while (med + k < floor && hi + k + 12 <= 96) k += 12;
    while (lo + k < 55 && hi + k + 12 <= 100) k += 12;
    return k;
  }
  // 예전 방식 반주(원곡)가 가장 낮은 음이 55(솔3) 위에 오도록
  function accShift(base, reg) {
    const lows = base.accomp.filter(a => a.ct === undefined).map(a => a.midi);
    const low = lows.length ? Math.min.apply(null, lows) : 60;
    let k = reg;
    while (low + k < 55) k += 12;
    return k;
  }
  // 편곡한 반주가 놓이는 가장 낮은 음(MIDI). 선율 아래 폰 스피커가 내는 범위에 깔려요.
  const ACC_FLOOR = { bass: 55, nbass: 55, stab: 60, strings: 60, pad: 60, pluck: 60, epiano: 60, harp: 55, chiparp: 60 };
  const lowOf = (pc, floor) => floor + ((((pc - floor) % 12) + 12) % 12);

  /* ---------- 변주 적용 ---------- */
  // 범위를 벗어나는 음은 옥타브 단위로 접어서 같은 음 이름으로 되돌려요 (잘라 내면 음계 밖 음이 되어 어긋나요)
  function clampMidi(m) { while (m > 100) m -= 12; while (m < 28) m += 12; return m; }

  function render(base, v) {
    const sc = base.scale, root = base.root, N = base.slots;
    const tempo = Math.max(0.5, Math.min(2, +v.tempo || 1));
    const slotSec = base.slotSec / tempo;
    const tr = (v.transpose | 0);
    let ev = [];
    base.notes.forEach(n => ev.push({ midi: n.midi, start: n.start, dur: n.dur, vel: n.vel, layer: n.grace ? 'grace' : 'lead' }));
    base.voice2.forEach(n => ev.push({ midi: n.midi, start: n.start, dur: n.dur, vel: n.vel, layer: 'voice2' }));
    if (v.harmony) {
      base.notes.forEach(n => {
        if (n.grace) return;
        ev.push({ midi: degToMidi(root, sc, n.deg + 2), start: n.start, dur: n.dur, vel: n.vel * 0.55, layer: 'harm' });
      });
    }
    if (v.sparkle) {
      let c = 0;
      base.notes.forEach(n => {
        if (!n.grace && n.dur >= 2 && c < 6) {
          ev.push({ midi: n.midi + 12, start: n.start + n.dur * 0.5, dur: 0.5, vel: 0.34, layer: 'spark' });
          c++;
        }
      });
    }
    if (v.reverse) ev.forEach(e => { e.start = Math.max(0, N - (e.start + e.dur)); });
    if (v.swing) ev.forEach(e => { if (Math.abs((e.start % 2) - 1) < 1e-6) e.start += 0.34; });
    const reg = regShift(base, v.voice), acc = accShift(base, reg);
    ev.forEach(e => { e.midi = clampMidi(e.midi + tr + reg); });
    ev.sort((a, b) => a.start - b.start || a.midi - b.midi);
    // 반주: 편곡한 것은 으뜸화음의 음이름에서 음높이를 찾고(키를 바꿔도 늘 같은 음역에 깔려요), 원곡 반주는 예전 방식 그대로예요
    const pcs = (base.chordPcs || []).map(p => (((p + tr) % 12) + 12) % 12);
    const accomp = base.accomp.map(a => {
      if (a.ct === undefined) return Object.assign({}, a, { midi: clampMidi(a.midi + tr + acc) });
      if (DRUMS[a.kind]) return Object.assign({}, a, { midi: 0 });
      const floor = ACC_FLOOR[a.kind] || 60;
      const pc = pcs[a.ct] === undefined ? pcs[0] : pcs[a.ct];
      return Object.assign({}, a, { midi: clampMidi(lowOf(pc, floor) + 12 * (a.o || 0)) });
    });
    const hum = humFrom(ev, base.humVowel || 'o');
    const cut = phraseCut(hum, N) * slotSec, total = N * slotSec;
    const lines = (base.text && base.text.lyric) || [];
    const lyric = { lines: lines.map((t, i) => ({ text: t, t0: i === 0 ? 0 : cut, t1: i === 0 ? cut : total })) };
    return {
      events: ev, accomp, hum, lyric, slotSec, slots: N, totalSec: total, legato: base.legato,
      root: root + tr + reg, reg, vars: Object.assign({}, v), bpm: base.bpm * tempo, style: base.style || 'original',
      scaleName: base.scaleName,
    };
  }

  /* ---------- 칩 아이콘용 곡선 ---------- */
  function contourSketch(emotionKey, n) {
    const emo = EMOTIONS[emotionKey];
    n = n || 10;
    const hs = [];
    for (let i = 0; i < n; i++) hs.push(emo.contour(n === 1 ? 1 : i / (n - 1)));
    const lo = Math.min.apply(null, hs), hi = Math.max.apply(null, hs);
    const span = hi - lo || 1;
    return hs.map(h => (h - lo) / span);
  }

  return {
    EMOTIONS, EMOTION_ORDER, REASONS, TENDENCIES, VOICES, VOICE_ORDER, STYLES, STYLE_ORDER, DRUMS, SCALES,
    build, render, contourSketch, regShift, degToMidi, hashStr, lyricLines, HUM_VOWEL, FEEL_LINE,
  };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = MelodyEngine;

const QR = (() => {

    M: [null, [10, [[1, 16]]], [16, [[1, 28]]], [26, [[1, 44]]], [18, [[2, 32]]], [24, [[2, 43]]], [16, [[4, 27]]], [18, [[4, 31]]], [22, [[2, 38], [2, 39]]], [22, [[3, 36], [2, 37]]], [26, [[4, 43], [1, 44]]]],
    Q: [null, [13, [[1, 13]]], [22, [[1, 22]]], [18, [[2, 17]]], [26, [[2, 24]]], [18, [[2, 15], [2, 16]]], [24, [[4, 19]]], [18, [[2, 14], [4, 15]]], [22, [[4, 18], [2, 19]]], [20, [[4, 16], [4, 17]]], [24, [[6, 19], [2, 20]]]],
    H: [null, [17, [[1, 9]]], [28, [[1, 16]]], [22, [[2, 13]]], [16, [[4, 9]]], [22, [[2, 11], [2, 12]]], [28, [[4, 15]]], [26, [[4, 13], [1, 14]]], [26, [[4, 14], [2, 15]]], [24, [[4, 12], [4, 13]]], [28, [[6, 15], [2, 16]]]],
  };

  const MAX_VERSION = 10;

  (function () {

    for (let i = 0; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];

  }

      setFn(8, 8, getBit(bits, 7));
      setFn(7, 8, getBit(bits, 8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, getBit(bits, i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, getBit(bits, i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, getBit(bits, i));

      const bits = (version << 12) | rem;

    function drawFinder(cx, cy) {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {

        const xx = cx + dx, yy = cy + dy;
        if (xx >= 0 && xx < size && yy >= 0 && yy < size) setFn(xx, yy, dist !== 2 && dist !== 4);
      }
    }
    function drawAlign(cx, cy) {
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setFn(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }

    // 고정 패턴
    for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    drawFinder(3, 3); drawFinder(size - 4, 3); drawFinder(3, size - 4);
    const pos = ALIGN[version], last = pos.length - 1;
    for (let i = 0; i < pos.length; i++) for (let j = 0; j < pos.length; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) continue;
      drawAlign(pos[i], pos[j]);
    }
    drawFormat(0);
    drawVersion();

    // 데이터 배치 (지그재그)
    const cw = makeCodewords(bytes, version, ecc);
    let bi = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const upward = ((right + 1) & 2) === 0;
          const y = upward ? size - 1 - vert : vert;
          if (!isFn[y][x] && bi < cw.length * 8) {
            modules[y][x] = getBit(cw[bi >>> 3], 7 - (bi & 7)) ? 1 : 0;
            bi++;
          }
        }
      }
    }

    // 마스크 선택
    const maskFns = [
      (x, y) => (x + y) % 2 === 0,
      (x, y) => y % 2 === 0,
      (x, y) => x % 3 === 0,
      (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
      (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0,
      (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0,
    ];
    const applyMask = m => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!isFn[y][x] && maskFns[m](x, y)) modules[y][x] ^= 1;
    };
    let bestMask = 0, bestPen = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m);
      drawFormat(m);
      const p = penalty(modules, size);
      if (p < bestPen) { bestPen = p; bestMask = m; }
      applyMask(m);
    }
    applyMask(bestMask);
    drawFormat(bestMask);
    return { version, ecc, mask: bestMask, size, modules: modules.map(r => r.slice()) };
  }

  function penalty(m, size) {
    let score = 0;
    const lineScore = get => {
      let s = 0;
      for (let a = 0; a < size; a++) {
        let run = 1;
        for (let b = 1; b < size; b++) {
          if (get(a, b) === get(a, b - 1)) { run++; if (run === 5) s += 3; else if (run > 5) s += 1; }
          else run = 1;
        }

        }

    score += lineScore((r, c) => m[r][c]);
    score += lineScore((c, r) => m[r][c]);
    for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
      const c = m[y][x];
      if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) score += 3;
    }
    let dark = 0;
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) dark += m[y][x];

  }

      let x = 0;
      while (x < n) {
        if (qr.modules[y][x]) {
          const x0 = x;
          while (x < n && qr.modules[y][x]) x++;
          d += 'M' + (x0 + margin) + ' ' + (y + margin) + 'h' + (x - x0) + 'v1h-' + (x - x0) + 'z';
        } else x++;
      }
    }

    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + s + ' ' + s + '" shape-rendering="crispEdges" role="img" aria-label="' + label + '">' +
      '<rect width="' + s + '" height="' + s + '" fill="' + light + '"/><path d="' + d + '" fill="' + dark + '"/></svg>';

<script>
/* ================================================================
 * audio.js : Web Audio 소리 엔진 (악기 4종 + 반주 + 잔향/에코)
 * 외부 파일 없이 오실레이터만으로 소리를 만든다.
 * ================================================================ */
const Sound = (() => {
  'use strict';

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  /* ---------- 악기 : (컨텍스트, 출력, 주파수, 시작시각, 길이, 세기, 밝기, 추적) ---------- */
  function osc(c, type, freq, t0, t1, track) {

  }

  function piano(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);

  function musicbox(c, dest, f, t, dur, vel, br, track) {

  function synth(c, dest, f, t, dur, vel, br, track) {

    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.012);
    out.gain.setValueAtTime(peak * 0.75, t + hold);
    out.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.22);
    [-7, 7].forEach(cents => {
      const o = osc(c, 'sawtooth', f, t, t + hold + 0.3, track);
      o.detune.value = cents;
      o.connect(lp);
    });
  }

  function flute(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500 + br * 4000; lp.connect(out);
    const hold = Math.max(dur, 0.22), peak = 0.2 * vel;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.07);
    out.gain.setValueAtTime(peak * 0.9, t + hold);
    out.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.25);
    const lg = c.createGain();
    lg.gain.setValueAtTime(0, t);
    lg.gain.linearRampToValueAtTime(9, t + Math.min(hold, 0.5));
    const lfo = osc(c, 'sine', 5.2, t, t + hold + 0.35, track);
    lfo.connect(lg);
    [[1, 1], [2, 0.18]].forEach(p => {
      const g = c.createGain(); g.gain.value = p[1]; g.connect(lp);
      const o = osc(c, 'sine', f * p[0], t, t + hold + 0.35, track);
      lg.connect(o.detune);
      o.connect(g);
    });
  }

  function pad(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650 + br * 700; lp.connect(out);
    const peak = 0.12 * vel, hold = Math.max(dur, 0.8);
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.45);
    out.gain.setValueAtTime(peak, t + Math.max(hold - 0.2, 0.5));
    out.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.9);

  }

  function pluck(c, dest, f, t, dur, vel, br, track) {

    out.gain.setValueAtTime(0.0001, t);

  /* ---------- 새 악기 ---------- */
  // 하프: 튕기자마자 밝았다가 따뜻하게 길게 울려요 (배음마다 사라지는 속도가 달라요)

    const out = c.createGain(); out.connect(dest);

    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.004);
    out.gain.exponentialRampToValueAtTime(0.0001, t + ring);
    [[1, 1, 1.0], [2, 0.5, 0.62], [3, 0.3, 0.4], [4, 0.17, 0.26], [5, 0.1, 0.18], [6, 0.06, 0.12]].forEach(p => {
      const g = c.createGain();
      g.gain.setValueAtTime(p[1] * (p[0] > 1 ? 0.5 + br * 0.9 : 1), t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.1, ring * p[2]));

  function guitar(c, dest, f, t, dur, vel, br, track) {

    const cut = 1100 + br * 3400;
    lp.frequency.setValueAtTime(Math.min(cut * 2.4, 9000), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(380, cut * 0.45), t + 0.45);
    lp.connect(out);
    const ring = 0.95 + Math.min(0.9, dur * 0.6), peak = 0.3 * vel;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.003);
    out.gain.exponentialRampToValueAtTime(peak * 0.38, t + 0.22);
    out.gain.exponentialRampToValueAtTime(0.0001, t + ring);
    [['sawtooth', 1, 0.7], ['triangle', 2, 0.28], ['sine', 1, 0.5]].forEach(p => {
      const g = c.createGain(); g.gain.value = p[2]; g.connect(lp);
      osc(c, p[0], f * p[1], t, t + ring + 0.1, track).connect(g);
    });
  }

  // 칼림바: 맑은 '띵' 소리 + 나무 울림
  function kalimba(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    const ring = 1.0 + Math.min(0.7, dur * 0.4), peak = 0.46 * vel;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.003);
    out.gain.exponentialRampToValueAtTime(0.0001, t + ring);

      g.gain.setValueAtTime(p[1], t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + p[2]);

  // 전자피아노(로즈): FM 으로 '뽕' 하는 종소리 같은 시작과 부드러운 울림
  function epiano(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    const hold = Math.max(dur, 0.2), peak = 0.3 * vel;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.006);
    out.gain.exponentialRampToValueAtTime(peak * 0.42, t + Math.min(0.6, hold));
    out.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.5);

  // 8비트: 폭 25% 펄스파 (가장자리가 거친 게임기 소리)
  const waveCache = new WeakMap();
  function pulseWave(c, duty) {

    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.003);

  }

  // 아코디언: 리드 두 장이 살짝 어긋나며 떨리는 소리 (트로트의 꺾는 맛)
  function accordion(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    const hold = Math.max(dur, 0.2), peak = 0.15 * vel;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.035);
    out.gain.setValueAtTime(peak * 0.92, t + hold);
    out.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.1);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400 + br * 2200; lp.Q.value = 0.8;
    const pk = c.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 1100; pk.Q.value = 1.2; pk.gain.value = 6;
    lp.connect(pk); pk.connect(out);
    const lg = c.createGain();
    lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(9, t + Math.min(hold, 0.35));
    const lfo = osc(c, 'sine', 5.8, t, t + hold + 0.2, track); lfo.connect(lg);
    [['sawtooth', 1, -5, 0.6], ['sawtooth', 1, 5, 0.6], ['square', 2, 0, 0.16]].forEach(p => {
      const g = c.createGain(); g.gain.value = p[3]; g.connect(lp);
      const o = osc(c, p[0], f * p[1], t, t + hold + 0.2, track);
      o.detune.value = p[2]; lg.connect(o.detune); o.connect(g);
    });
  }

  // EDM 신스: 톱니파 다섯 겹 (슈퍼소우)
  function saw(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.0; lp.frequency.value = 2200 + br * 3600; lp.connect(out);
    const hold = Math.max(dur, 0.12), peak = 0.075 * vel;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.006);
    out.gain.setValueAtTime(peak * 0.9, t + hold);
    out.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.12);
    [-16, -8, 0, 8, 16].forEach(cents => {
      const o = osc(c, 'sawtooth', f, t, t + hold + 0.2, track);
      o.detune.value = cents; o.connect(lp);
    });
  }

  /* ---------- 반주 소리 ---------- */
  function bass(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.4;
    lp.frequency.setValueAtTime(1500, t); lp.frequency.exponentialRampToValueAtTime(520, t + 0.2);
    lp.connect(out);
    const hold = Math.max(dur, 0.12), peak = 0.24 * vel;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.008);
    out.gain.exponentialRampToValueAtTime(peak * 0.6, t + Math.min(0.3, hold));
    out.gain.setValueAtTime(peak * 0.55, t + hold);
    out.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.08);
    [['triangle', 1, 1], ['sawtooth', 1, 0.35]].forEach(p => {
      const g = c.createGain(); g.gain.value = p[2]; g.connect(lp);
      osc(c, p[0], f, t, t + hold + 0.15, track).connect(g);
    });
  }
  function nbass(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    const hold = Math.max(dur * 0.92, 0.08), peak = 0.26 * vel;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.003);
    out.gain.setValueAtTime(peak, t + hold);
    out.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.03);
    osc(c, 'triangle', f, t, t + hold + 0.06, track).connect(out);
  }
  function stab(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 2;
    const cut = 1700 + br * 2600;
    lp.frequency.setValueAtTime(cut, t); lp.frequency.exponentialRampToValueAtTime(600, t + 0.2);
    lp.connect(out);
    const len = Math.min(0.34, Math.max(0.1, dur * 0.7)), peak = 0.15 * vel;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.004);
    out.gain.exponentialRampToValueAtTime(0.0001, t + len);
    [-6, 6].forEach(cents => { const o = osc(c, 'sawtooth', f, t, t + len + 0.1, track); o.detune.value = cents; o.connect(lp); });
  }
  function strings(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300 + br * 900; lp.connect(out);
    const hold = Math.max(dur, 0.8), peak = 0.065 * vel;
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.3);
    out.gain.setValueAtTime(peak, t + Math.max(hold - 0.2, 0.4));
    out.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.5);
    [-9, 0, 9].forEach(cents => { const o = osc(c, 'sawtooth', f, t, t + hold + 0.6, track); o.detune.value = cents; o.connect(lp); });
  }

  /* ---------- 타악기: 폰 스피커가 내는 중간 음역(150Hz~)에서 또렷하게 들리도록 만들었어요 ---------- */
  const noiseBufs = new WeakMap();
  function noiseBuf(c) {
    let b = noiseBufs.get(c);
    if (!b) {
      const len = Math.floor(c.sampleRate * 1.6);
      b = c.createBuffer(1, len, c.sampleRate);
      const d = b.getChannelData(0);
      let s = 20240607;
      for (let i = 0; i < len; i++) { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; d[i] = (s / 2147483648) - 1; }
      noiseBufs.set(c, b);
    }
    return b;
  }
  function noise(c, t0, t1, track) {
    const n = c.createBufferSource();
    n.buffer = noiseBuf(c);
    n.start(t0, (t0 * 7.13) % 0.35); n.stop(t1); track(n);
    return n;
  }
  function burst(c, out, t, len, type, freq, q, peak, track, atk) {
    const n = noise(c, t, t + len + 0.05, track);
    const flt = c.createBiquadFilter(); flt.type = type; flt.frequency.value = freq; if (q) flt.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + (atk || 0.002));
    g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    n.connect(flt); flt.connect(g); g.connect(out);
  }
  function kick(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(0.7 * vel, t + 0.003);
    out.gain.exponentialRampToValueAtTime(0.0001, t + 0.24);
    const o = osc(c, 'sine', 300, t, t + 0.3, track);
    o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.12);
    o.connect(out);
    burst(c, out, t, 0.03, 'bandpass', 2400, 0.9, 0.5 * vel, track, 0.001);
  }
  function snare(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    const bg = c.createGain();
    bg.gain.setValueAtTime(0.32 * vel, t); bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.12); bg.connect(out);
    const o = osc(c, 'triangle', 190, t, t + 0.16, track);
    o.frequency.setValueAtTime(250, t); o.frequency.exponentialRampToValueAtTime(175, t + 0.08);
    o.connect(bg);
    burst(c, out, t, 0.19, 'highpass', 1500, 0.7, 0.42 * vel, track, 0.002);
  }
  function clap(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    [0, 0.011, 0.023].forEach(d => burst(c, out, t + d, 0.03, 'bandpass', 1500, 1.1, 0.34 * vel, track, 0.001));
    burst(c, out, t + 0.03, 0.16, 'bandpass', 1300, 0.9, 0.3 * vel, track, 0.004);
  }
  const hat = (c, dest, f, t, dur, vel, br, track) => burst(c, dest, t, 0.04, 'highpass', 7000, 0.6, 0.22 * vel, track, 0.001);
  const ohat = (c, dest, f, t, dur, vel, br, track) => burst(c, dest, t, 0.22, 'highpass', 6500, 0.6, 0.2 * vel, track, 0.002);
  function ride(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    burst(c, out, t, 0.5, 'highpass', 6000, 0.6, 0.16 * vel, track, 0.002);
    [3150, 4380, 5710].forEach(fr => {
      const g = c.createGain(); g.gain.setValueAtTime(0.03 * vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45); g.connect(out);
      osc(c, 'square', fr, t, t + 0.5, track).connect(g);
    });
  }
  const crash = (c, dest, f, t, dur, vel, br, track) => burst(c, dest, t, 1.1, 'highpass', 4200, 0.5, 0.26 * vel, track, 0.004);
  function nkick(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    out.gain.setValueAtTime(0.0001, t);
    out.gain.linearRampToValueAtTime(0.55 * vel, t + 0.002);
    out.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    const o = osc(c, 'triangle', 260, t, t + 0.18, track);
    o.frequency.setValueAtTime(280, t); o.frequency.exponentialRampToValueAtTime(80, t + 0.1);
    o.connect(out);
  }
  function nsnare(c, dest, f, t, dur, vel, br, track) {
    const out = c.createGain(); out.connect(dest);
    burst(c, out, t, 0.1, 'bandpass', 3600, 0.7, 0.42 * vel, track, 0.001);
    const g = c.createGain(); g.gain.setValueAtTime(0.18 * vel, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06); g.connect(out);
    pulse(c, 200, t, t + 0.08, 0.5, track).connect(g);
  }
  const nhat = (c, dest, f, t, dur, vel, br, track) => burst(c, dest, t, 0.03, 'highpass', 9000, 0.5, 0.18 * vel, track, 0.001);

  const LEADS = { piano, musicbox, synth, flute, harp, guitar, kalimba, epiano, chip, accordion, saw };
  const ACC = { pad, pluck, bass, nbass, stab, strings, chiparp, epiano, harp, kick, snare, clap, hat, ohat, ride, crash, nkick, nsnare, nhat };

  /* ---------- 허밍: 사람 목소리처럼 들리는 소리 ----------
     톱니파 하나(성대)를 모음 필터 셋(입 모양)에 통과시켜요. 음과 음 사이는 미끄러지듯 이어지고,
     입을 다문 ‘음~’ 으로 시작해 모음으로 열었다가 다시 다물어요. 긴 음에는 살짝 떨리는 비브라토가 얹혀요.
     선율을 같은 높이로 따라 부르기 때문에 악기 소리에 목소리 결이 더해져요. */
  const FORMANT = {                 // 모음별 입 모양 [F1, F2, F3] (Hz)
    u: [330, 800, 2500], o: [480, 880, 2550], a: [780, 1230, 2600], e: [540, 1850, 2650],
    i: [320, 2150, 2850], eo: [620, 1050, 2550], eu: [380, 1300, 2450],
  };
  /* 높은 음에서는 소리 높이(배음)가 모음 필터에서 벗어나면 그 음만 작게 들려요. 음마다 필터를 지나는 소리 크기를
     미리 계산해서 같은 크기로 맞춰 줘요 (노래하는 사람이 음에 맞춰 입 모양을 조절하는 것과 비슷해요). */
  const HQ = [4, 5, 6], HW = [1.0, 0.75, 0.4];
  function formantPower(f0, F) {
    let p = 0;
    for (let k = 1; k * f0 < 9000; k++) {
      const f = k * f0;
      let h = 0;
      for (let i = 0; i < 3; i++) { const r = f / F[i] - F[i] / f; h += HW[i] / Math.sqrt(1 + HQ[i] * HQ[i] * r * r); }
      const tilt = 1 / Math.sqrt(1 + Math.pow(f / 2600, 4));
      p += Math.pow(h * tilt / k, 2);
    }
    return p;
  }
  const HREF = formantPower(700, FORMANT.a);
  const humComp = (f0, vowel) => Math.max(0.5, Math.min(2.8, Math.sqrt(HREF / formantPower(f0, FORMANT[vowel] || FORMANT.o))));
  // 악기 소리보다 약 6dB 작게 (잔향·컴프레서 전 기준) (오르골은 소리가 금방 사라져서 허밍을 더 작게 맞춰요)
  const HUM_BY_VOICE = { piano: 0.12, synth: 0.14, flute: 0.13, musicbox: 0.10 };

  const stats = { humPhrases: 0 };   // 점검용: 지금까지 만든 허밍 구절 수

  function humPhrase(c, out, notes, t0, sec, track, level) {
    stats.humPhrases++;
    const tStart = t0 + sec(notes[0].start);
    const lastN = notes[notes.length - 1];
    const tEnd = t0 + sec(lastN.start + lastN.dur);
    const src = c.createOscillator(); src.type = 'sawtooth'; src.frequency.value = mtof(notes[0].midi);
    const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 5.2;
    const vib = c.createGain(); vib.gain.value = 0;
    lfo.connect(vib); vib.connect(src.detune);
    const tilt = c.createBiquadFilter(); tilt.type = 'lowpass'; tilt.frequency.value = 2600; tilt.Q.value = 0.4;   // 높은 소리일수록 약하게
    src.connect(tilt);
    const open = c.createGain(), closed = c.createGain(), amp = c.createGain();
    open.gain.value = 0.0001; closed.gain.value = 0.4; amp.gain.value = 0.0001;
    const F0 = FORMANT[notes[0].vowel] || FORMANT.o;
    const bps = [0, 1, 2].map(k => {
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = HQ[k]; f.frequency.value = F0[k];
      const g = c.createGain(); g.gain.value = HW[k];
      tilt.connect(f); f.connect(g); g.connect(open);
      return f;
    });
    const mm = c.createBiquadFilter(); mm.type = 'lowpass'; mm.frequency.value = 560; mm.Q.value = 1.1;         // 다문 입: 어둡고 둥근 소리
    tilt.connect(mm); mm.connect(closed);
    open.connect(amp); closed.connect(amp);
    const soft = c.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 5200;
    amp.connect(soft); soft.connect(out);

    notes.forEach((n, i) => {
      const ti = t0 + sec(n.start), di = Math.max(0.12, sec(n.dur) * 0.97), f = mtof(n.midi);
      if (i === 0) { src.frequency.setValueAtTime(f * 0.972, ti); src.frequency.setTargetAtTime(f, ti + 0.01, 0.05); }   // 살짝 아래서 올라오며 시작
      else src.frequency.setTargetAtTime(f, ti, 0.035);                                                              // 음 사이는 미끄러지듯
      const v = FORMANT[n.vowel] || FORMANT.o;
      bps.forEach((b, k) => b.frequency.setTargetAtTime(v[k], ti, 0.04));
      const pk = level * humComp(f, n.vowel) * (0.55 + 0.45 * n.vel);
      amp.gain.setTargetAtTime(pk, ti, 0.04);
      if (di > 0.3) amp.gain.setTargetAtTime(pk * 0.82, ti + di * 0.6, 0.12);
      if (i + 1 < notes.length) amp.gain.setTargetAtTime(pk * 0.62, ti + di - 0.05, 0.02);                          // 다음 음 앞에서 살짝 눌러 끊어 줘요
      if (di > 0.34) { vib.gain.setTargetAtTime(20, ti + 0.2, 0.12); vib.gain.setTargetAtTime(0, ti + di - 0.02, 0.03); }
    });
    open.gain.setTargetAtTime(1, tStart + 0.05, 0.06); closed.gain.setTargetAtTime(0.07, tStart + 0.05, 0.06);
    if (tEnd - tStart > 0.55) { open.gain.setTargetAtTime(0.0001, tEnd - 0.16, 0.07); closed.gain.setTargetAtTime(0.4, tEnd - 0.16, 0.07); }
    amp.gain.setTargetAtTime(0.0001, tEnd - 0.02, 0.09);
    const stopAt = tEnd + 0.8;
    [src, lfo].forEach(o => { o.start(Math.max(0, tStart - 0.03)); o.stop(stopAt); track(o); });
  }

  function humLayer(c, out, notes, t0, sec, track, level) {
    let ph = [];
    const flush = () => { if (ph.length) humPhrase(c, out, ph, t0, sec, track, level); ph = []; };
    notes.forEach(n => {
      const prev = ph[ph.length - 1];
      if (prev && sec(n.start - (prev.start + prev.dur)) > 0.35) flush();     // 길게 쉬면 숨을 쉬고 새로 시작해요
      ph.push(n);
    });
    flush();
  }

  /* ---------- 한 번의 연주를 예약 ---------- */
  function schedule(c, final, t0, out, track, noHum) {
    const v = final.vars || {};
    const lead = LEADS[v.voice] || piano;
    const br = typeof v.bright === 'number' ? v.bright : 0.6;
    const sec = s => s * final.slotSec;
    final.events.forEach(e => {
      const t = t0 + sec(e.start);
      const play = Math.max(0.1, sec(e.dur) * final.legato);
      const f = mtof(e.midi);
      if (e.layer === 'spark') musicbox(c, out, f, t, play, e.vel, 0.9, track);
      else lead(c, out, f, t, play, e.vel * (e.layer === 'lead' ? 1 : e.layer === 'grace' ? 0.8 : 0.85), br, track);
    });
    (final.accomp || []).forEach(a => {
      const t = t0 + sec(a.start);
      (ACC[a.kind] || pluck)(c, out, mtof(a.midi || 60), t, sec(a.dur), a.vel, br, track);
    });
    if (!noHum && !(typeof CONFIG !== 'undefined' && CONFIG.hum === false) && final.hum && final.hum.length) humLayer(c, out, final.hum, t0, sec, track, typeof final.humLevel === 'number' ? final.humLevel : (HUM_BY_VOICE[v.voice] || 0.36));
  }

  /* ---------- 공통 효과 (잔향, 에코, 컴프레서, 리미터) ---------- */
  const TRIM = 0.89;
  const UNDER_VOICE = 0.72;   // 가사를 목소리로 읽는 동안 멜로디를 약 3dB 낮춰서 말이 잘 들리게 해요
  function makeImpulse(c) {
    const len = Math.floor(c.sampleRate * 2.3);
    const buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    return buf;
  }
  function buildGraph(c) {
    // 소리 길: 악기 -> bus -> master -> (저음 덜어내기 -> 또렷하게 -> 컴프레서 -> 리미터) -> 스피커
    const master = c.createGain();
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 140; hp.Q.value = 0.7;     // 폰 스피커가 못 내는 저음
    const pres = c.createBiquadFilter(); pres.type = 'peaking'; pres.frequency.value = 2400; pres.Q.value = 0.8; pres.gain.value = 2.5; // 길거리에서도 또렷하게
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -26; comp.knee.value = 14; comp.ratio.value = 3.5; comp.attack.value = 0.004; comp.release.value = 0.2;
    const lim = c.createDynamicsCompressor();
    lim.threshold.value = -4; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.09;
    const trim = c.createGain(); trim.gain.value = TRIM;                                                       // 피크 약 -1dBFS
    master.connect(hp); hp.connect(pres); pres.connect(comp); comp.connect(lim); lim.connect(trim); trim.connect(c.destination);
    const bus = c.createGain(); bus.connect(master);
    const conv = c.createConvolver(); conv.buffer = makeImpulse(c);
    const reverbSend = c.createGain(); reverbSend.gain.value = 0.3;
    bus.connect(reverbSend); reverbSend.connect(conv); conv.connect(master);
    const dly = c.createDelay(1.0); dly.delayTime.value = 0.32;
    const fb = c.createGain(); fb.gain.value = 0.38;
    const dlp = c.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
    const delaySend = c.createGain(); delaySend.gain.value = 0;
    bus.connect(delaySend); delaySend.connect(dly); dly.connect(dlp); dlp.connect(fb); fb.connect(dly); dlp.connect(master);
    return { master, bus, reverbSend, delaySend, trim };
  }
  function applyFx(g, v, c, instant) {
    const now = c.currentTime, tc = instant ? 0.001 : 0.05;
    g.reverbSend.gain.setTargetAtTime(Math.max(0, Math.min(1, v.reverb || 0)) * 0.85, now, tc);
    g.delaySend.gain.setTargetAtTime(v.echo ? 0.42 : 0, now, tc);
  }

  /* ---------- 곡마다 음량 맞추기 ----------
